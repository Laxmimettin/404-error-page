<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="error-container">
        <div class="illustration" aria-hidden="true">
            <div class="planet">
                <span class="crater crater-one"></span>
                <span class="crater crater-two"></span>
                <span class="crater crater-three"></span>
            </div>
            <span class="orbit orbit-one"></span>
            <span class="orbit orbit-two"></span>
            <span class="star star-one">✦</span>
            <span class="star star-two">✧</span>
            <span class="star star-three">✦</span>
        </div>

        <h1>404</h1>
        <h2>Oops! You're lost in space.</h2>

        <p>
            The page you're looking for doesn't exist or may
            have been moved. Don't worry, let's get you back
            on track!
        </p>

        <a href="index.html" class="home-button">
            <span aria-hidden="true">←</span> Back to Home
        </a>

        <div class="footer-text">Lost? Even the stars find their way.</div>
    </main>

</body>

</html>
